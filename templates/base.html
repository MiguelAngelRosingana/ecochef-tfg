<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EcoChef{% endblock %} - EcoChef</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-custom fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="bi bi-recycle text-success"></i> EcoChef
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav gap-3">
                    <li class="nav-item">
                        <a class="nav-link" href="/nevera"><i class="bi bi-snow"></i> Mi Nevera</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/recetas"><i class="bi bi-magic"></i> Cocinar</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-eco btn-sm ms-2" href="/lista">
                            <i class="bi bi-cart-check"></i> Lista Compra
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div style="height: 80px;"></div>

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-premium">
        <div class="container">
            <small>
                Desarrollado para TFG de DAW | 
                <i class="bi bi-code-slash"></i> con Python Flask y 💚
            </small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <div id="loading-overlay" class="position-fixed top-0 start-0 w-100 h-100 bg-white d-none justify-content-center align-items-center" style="z-index: 9999; opacity: 0.9;">
    <div class="text-center">
        <div class="spinner-border text-success" style="width: 4rem; height: 4rem;" role="status"></div>
        <h4 class="mt-3 fw-bold text-success">Consultando con el Chef...</h4>
        <p class="text-muted">Buscando recetas deliciosas.</p>
    </div>
</div>

<script>
    // Script para mostrar el spinner cuando se envían formularios
    document.addEventListener('DOMContentLoaded', function() {
        const forms = document.querySelectorAll('form');
        const overlay = document.getElementById('loading-overlay');
        
        forms.forEach(form => {
            form.addEventListener('submit', function() {
                // Solo activamos si el formulario no tiene errores obvios
                overlay.classList.remove('d-none');
                overlay.classList.add('d-flex');
            });
        });

        // También para el enlace de "Buscar Recetas" del menú
        const recipeLinks = document.querySelectorAll('a[href="/recetas"]');
        recipeLinks.forEach(link => {
            link.addEventListener('click', function() {
                overlay.classList.remove('d-none');
                overlay.classList.add('d-flex');
            });
        });
    });
</script>
</body>
</html>
